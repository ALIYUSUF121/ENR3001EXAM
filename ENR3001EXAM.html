            { question: "Which risks are associated with constraints imposed by management or the marketplace?", options: { A: "Business impact risks", B: "Process defnition risks", C: "Product size risks", D: "Development environment risks" }, correct: 'A', explanation: "These external or high-level constraints directly impact the business case or feasibility of the project." },
            { question: "Risk projection (or analysis) attempts to rate each risk in two ways:", options: { A: "Likelihood and size", B: "Likelihood and probability", C: "Likelihood and impact", D: "Likelihood and mitigation" }, correct: 'C', explanation: "Risks are typically assessed based on their likelihood (probability) of occurring and their potential impact (consequences) if they do occur." },
            { question: "An effective risk management plan must address which of the following issues?", options: { A: "Risk avoidance", B: "Risk monitoring", C: "Contingency planning", D: "All of the above" }, correct: 'D', explanation: "A comprehensive plan includes strategies (like avoidance), monitoring processes, and fallback plans (contingency)." },
            { question: "The main outcome of risk identifcation is to:", options: { A: "Identify and determine the relative importance of project risks", B: "Identify and describe all risks that might occur on the project", C: "Identify and determine the responses to project risks", D: "Identify and describe risks that have occurred on previous projects" }, correct: 'B', explanation: "The primary goal of identification is creating a list of potential risks. Prioritization (A) and response planning (C) come next." },
            { question: "Project risk management is best described as:", options: { A: "Managing responses to threats", B: "Identifying and acknowledging threats and opportunities", C: "Planning responses to threats", D: "Minimizing threats and maximizing opportunities" }, correct: 'D', explanation: "Modern risk management considers both negative risks (threats) and positive risks (opportunities)." },
            { question: "Because risks are unplanned events with negative repercussions, systematic risk management is an essential precondition for:", options: { A: "Project planning", B: "Quality management", C: "Achieving project goals", D: "Project budgeting" }, correct: 'C', explanation: "Managing risks is crucial for successfully achieving the overall project objectives despite uncertainties." },
            { question: "“Anyone who runs a project without risk management is engaging in risky management.” Which risk should be rated as “very high” if identifed?", options: { A: "Deviation from budgeted project costs by plus 10%", B: "Negligible deviation from project scope (functional scope)", C: "Schedule overrun by 10% of project duration", D: "Project result not usable" }, correct: 'D', explanation: "A useless project result represents a total failure and thus carries the highest possible negative impact." },
            { question: "The main aim of a project risk management process should be to:", options: { A: "Identify project risks and then manage them appropriately", B: "Identify all project risks and transfer them immediately", C: "Identify all the things that are threats or opportunities on a project", D: "Satisfy the organization’s project management process" }, correct: 'A', explanation: "The core purpose is to proactively identify and manage risks throughout the project lifecycle." },
            // --- Section 5: Innovation and Entrepreneurship ---
            { question: "Once a new product design becomes a dominant design, it:", options: { A: "Is adopted by the majority of producers", B: "Becomes no longer proftable", C: "Destabilizes the industry’s architecture for focus", D: "Becomes difcult for competitors to imitate" }, correct: 'A', explanation: "A dominant design sets a standard that most competitors converge upon." },
            { question: "The frst entrants to sell in a new product or service category are referred to as:", options: { A: "Laggards", B: "Pioneers", C: "Early followers", D: "Early leaders" }, correct: 'B', explanation: "Pioneers or first movers are the initial entrants into a market." },
            { question: "Ceramic Customs Corp. was forced to source a specifc ceramic from a single supplier because:", options: { A: "The supply was unlimited", B: "The supplier had more bargaining power than the frm", C: "The supply exceeded the demand", D: "The industry had barriers to entry" }, correct: 'B', explanation: "Being reliant on a single source gives that supplier significant bargaining power (a concept from Porter's Five Forces)." },
            { question: "Africa Software Inc. is trying to estimate its installed base by assessing the number of:", options: { A: "Users of its software", B: "Areas in which its software can be applied", C: "Substitutes available for its software", D: "Developers working on its software" }, correct: 'A', explanation: "Installed base refers to the number of units of a product or service currently in use." },
            { question: "Marine Systems was frst to develop an inventory management software for hotels and restaurants. Soon after, Unicorn Systems launched a similar product that outperformed the frst and became the market leader. Unicorn Systems is an example of a(n):", options: { A: "Late mover", B: "Eccentric laggard", C: "Early follower", D: "First pioneer" }, correct: 'C', explanation: "Early followers enter the market shortly after pioneers, often learning from their successes and failures." },
            { question: "Technological innovations increase:", options: { A: "The gross domestic product of an economy", B: "Product life cycles", C: "The production costs of multiple product variations", D: "The time required for product development and introduction" }, correct: 'A', explanation: "Innovation drives productivity and economic growth, contributing to GDP." },
            { question: "Digital cameras replaced flm cameras. Therefore, digital cameras are an example of:", options: { A: "Component innovation", B: "Incremental technology", C: "Discontinuous (radical) technology", D: "Modular innovation" }, correct: 'C', explanation: "This represents a fundamental shift in technology that disrupts the existing market, making it a discontinuous or radical innovation." },
            { question: "Which of the following is true of technological innovations?", options: { A: "They increase production costs and reduce product differentiation", B: "They decrease the amount of output achievable from a given quantity of labor and capital", C: "They slow down product obsolescence and lengthen product development cycles", D: "They help increase a country’s gross domestic product" }, correct: 'D', explanation: "As mentioned before, innovation drives economic growth (GDP). Options A, B, and C are generally the opposite of what innovation does." },
            { question: "Which of the following is an example of user innovation?", options: { A: "Sandra, an engineer, develops a device to track her teenage daughter’s car", B: "Ivan, a scientist, develops an anti-infammatory drug for company commercialization", C: "Samuel invents a detachable bicycle to sell to a bicycle manufacturer", D: "Jessica, a designer, is tasked with working on a temperature–sensitive fabric dye" }, correct: 'A', explanation: "User innovation comes from individuals solving their own needs, not as part of their job (B, D) or with the primary intent to sell to a manufacturer (C)." }
        ];

        // --- DOM Elements ---
        const progressText = document.getElementById('progress');
        const questionText = document.getElementById('question');
        const optionsContainer = document.getElementById('options');
        const feedbackText = document.getElementById('feedback');
        const explanationText = document.getElementById('explanation');
        const scoreDisplay = document.getElementById('score-display');
        const nextButton = document.getElementById('next-button');
        const quizArea = document.getElementById('quiz-area');
        const finalScoreArea = document.getElementById('final-score-area');
        const finalScoreText = document.getElementById('final-score');
        const finalPercentageText = document.getElementById('final-percentage');
        const restartButton = document.getElementById('restart-button');

        // --- Quiz State ---
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];

        // --- Functions ---

        /** Shuffles array elements in-place. ES6 version */
        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        /** Starts or restarts the quiz. */
        function startQuiz() {
            score = 0;
            currentQuestionIndex = 0;
            shuffledQuestions = shuffle([...quizData]);
            scoreDisplay.textContent = `Score: 0`;
            finalScoreArea.classList.add('hidden');
            quizArea.classList.remove('hidden');
            nextButton.classList.add('hidden');
            showQuestion();
        }

        /** Displays the current question and options. */
        function showQuestion() {
            optionsContainer.innerHTML = '';
            feedbackText.textContent = '';
            explanationText.textContent = '';
            nextButton.classList.add('hidden');

            const currentQuestion = shuffledQuestions[currentQuestionIndex];
            progressText.textContent = `Question ${currentQuestionIndex + 1} of ${shuffledQuestions.length}`;
            questionText.textContent = currentQuestion.question;

            const options = Object.entries(currentQuestion.options).sort();

            options.forEach(([key, value]) => {
                const button = document.createElement('button');
                button.textContent = `${key}) ${value}`;
                button.dataset.key = key;
                button.className = 'option-button block w-full text-left p-3 border border-gray-300 rounded-md bg-white hover:bg-gray-100 transition duration-200 text-gray-800';
                button.addEventListener('click', () => selectAnswer(button, key, currentQuestion.correct, currentQuestion.explanation));
                optionsContainer.appendChild(button);
            });
        }

        /** Handles the user selecting an answer. */
        function selectAnswer(selectedButton, selectedKey, correctKey, explanation) {
            const allOptionButtons = optionsContainer.querySelectorAll('button');
            allOptionButtons.forEach(btn => btn.disabled = true);

            const isCorrect = selectedKey === correctKey;

            if (isCorrect) {
                score++;
                selectedButton.classList.add('correct');
                feedbackText.textContent = 'Correct!';
                feedbackText.style.color = 'green';
            } else {
                selectedButton.classList.add('incorrect');
                feedbackText.textContent = `Incorrect. The correct answer was ${correctKey}.`;
                feedbackText.style.color = 'red';
                const correctButton = optionsContainer.querySelector(`button[data-key="${correctKey}"]`);
                if (correctButton) {
                     correctButton.classList.add('correct');
                }
            }

            if (explanation) {
                explanationText.textContent = `Explanation: ${explanation}`;
            }

            scoreDisplay.textContent = `Score: ${score}`;
            nextButton.classList.remove('hidden');
        }

        /** Moves to the next question or shows the final score. */
        function showNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                showQuestion();
            } else {
                showFinalScore();
            }
        }

        /** Displays the final score screen. */
        function showFinalScore() {
            quizArea.classList.add('hidden');
            finalScoreArea.classList.remove('hidden');
            const percentage = ((score / shuffledQuestions.length) * 100).toFixed(1);
            finalScoreText.textContent = `Your final score is ${score} out of ${shuffledQuestions.length}.`;
            finalPercentageText.textContent = `Percentage: ${percentage}%`;
        }

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', startQuiz);
        nextButton.addEventListener('click', showNextQuestion);
        restartButton.addEventListener('click', startQuiz);

        // --- End of Embedded JavaScript ---
    </script>
